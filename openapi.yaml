        generating FT-12.9 or FT-9.13 official PDF documents.
      operationId: updatePrintTemplate
      parameters:
      - name: templateKey
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePrintTemplateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PrintTemplateDto"
        "400":
          description: Bad Request / Validation Error (ERR_VALIDATION_FAILED / ERR_BAD_REQUEST)
