openapi: 3.1.0
info:
  title: TTPU "Raqamli Inventar" — Digital Inventory ERP API
  description: |
    Unified Modular Monolith Backend API for Turin Polytechnic University in Tashkent (TTPU).
    Serves the Web ERP portal (Next.js) and Mobile apps (Kotlin Multiplatform - Android & iOS)
    across 16 strict Spring Modulith domains, following an OpenAPI 3.0 Contract-First architecture
    with RFC 7807 (application/problem+json) errors and uz/ru/en localization.
  contact:
    name: TTPU IT & Digital Inventory Center
    url: https://ttpu.uz
    email: inventory.admin@ttpu.uz
  license:
    name: TTPU Internal Enterprise License
  version: v1.0.0
servers:
- url: http://localhost:8080
  description: Local / Docker Backend API Server
- url: http://localhost:4010
  description: Stoplight Prism Mock Server (for Next.js & KMP Clients)
security:
- bearerAuth: []
tags:
- name: 11. File & Document Storage (MinIO)
  description: "Attachment storage metadata, SHA-256 integrity checksum calculation,\
    \ S3 object key tracking for photos, scanned documents, and signed PDFs with allowed\
    \ type and size validations."
- name: 01. Mobile Device Management & Revocation (NFT-3.8)
  description: "Registers mobile devices upon login and provides administrator endpoints\
    \ to revoke devices, making their JWTs invalid within 1 minute."
- name: "12. Multi-Channel Notifications (Email, Telegram, FCM Push)"
  description: "Event-driven and manual notifications dispatched across SMTP Email,\
    \ Telegram Bot API, and Firebase Cloud Messaging (FCM) Push."
- name: 06. Item Card Audit Trail
  description: "Immutable AOP-captured audit logs (READ, CHANGE, EXPORT) recorded\
    \ in audit_record for item cards and inventory exports."
- name: 09. Security Checkpoint & Off-Campus Permits
  description: B3.4 Temporary off-campus permits and campus gate verification endpoint
    returning 'may leave' or 'may not' on scanned QR IDs.
- name: 17. Streaming XLSX Inventory Reports (Apache POI SXSSF)
  description: "High-throughput Apache POI SXSSF streaming XLSX report generation\
    \ (10,000+ rows in under 30 seconds) and Thymeleaf + OpenHTMLtoPDF official PDF\
    \ print forms (FT-12.9 Handover Act, FT-9.13 Opis, Comparison Statement, and Final\
    \ Act) with embedded E-IMZO PKCS#7 signature metadata."
- name: 01. Security & Authentication
  description: "Stateless OAuth2 JWT authentication, Argon2id password verification,\
    \ mandatory 2FA TOTP verification, SHA-256 refresh token rotation, 5-attempt account\
    \ lockout, and Bucket4j rate limiting."
- name: 03. Asset Management & Item State Machine
  description: "Core inventory items, 8-state lifecycle state machine (ItemStateService),\
    \ state transition history, and audited item card operations."
- name: 05. Warehouse Receipts (Приход)
  description: "Warehouse goods receipt documents (contracts, invoices, suppliers,\
    \ receipt lines), per-category serial number uniqueness enforcement, and receipt\
    \ approval."
- name: 14. Mobile Offline Sync & Reconciliation
  description: "Versioned offline session packages for Android/iOS commission apps,\
    \ idempotent batch scan synchronization (clientActionId UUID deduplication), and\
    \ 4-category session reconciliation."
- name: 02. Reference Data & Envers History
  description: "CRUD operations, soft-deactivation (active=false), and Hibernate Envers\
    \ revision history for Buildings, Floors, Departments, Rooms, Employees, and Asset\
    \ Categories (with JSONB custom fields)."
- name: 10. Repair & Vendor Maintenance Tickets
  description: Repair ticket lifecycle (NEW -> IN_PROGRESS -> IN_SERVICE -> DONE ->
    CLOSED) with event-driven item state transitions to/from TAMIRDA and multi-channel
    notifications.
- name: "15. External Integrations: Transactional Outbox, 1C, HEMIS & E-IMZO"
  description: "Transactional Outbox queue with Resilience4j Retry + CircuitBreaker,\
    \ 1C Accounting item export & depreciation ingestion, HEMIS daily sync, E-IMZO\
    \ signatures, and B2.2 Two-Phase 1C XLSX/CSV Import."
- name: 16. Finance Write-Off & Disposal
  description: "Asset disposal, accounting balance sheet write-off, mandatory B5.6\
    \ IT data-wipe certification, and usable parts reclamation back into warehouse\
    \ stock."
- name: "13. Inventory Sessions, Live STOMP Dashboard & FT-9.13 Official PDFs"
  description: "University inventory audit sessions (rector's order, commission members,\
    \ room snapshots), QR scanning, reconciliation, real-time STOMP WebSocket progress\
    \ broadcasts (/ws/inventory), and official FT-9.13 PDF generation (Opis, Comparison\
    \ Statement, and Final Act) with E-IMZO digital signatures."
- name: 08. Asset Requisition Requests
  description: Employee and department asset requisition requests (DRAFT -> SUBMITTED
    -> APPROVED/REJECTED -> FULFILLED) integrated with the Generic Workflow Engine.
- name: 07. Generic Workflow Approval Engine
  description: "Multi-step conditional approval workflows for SERVICE_REQUEST, TRANSFER,\
    \ and WRITE_OFF documents with E-IMZO PKCS#7 digital signature or 2FA TOTP step\
    \ verification."
- name: 08. Offboarding Clearance Checklist (Aylanma varaqa)
  description: B3.3 Clearance checklist opened upon HEMIS employee dismissal. Hard-blocks
    closure until 100% of assigned inventory is handed over or transferred.
- name: 04. Public QR Item Card
  description: "Publicly accessible QR scan endpoints (/a/{id} and /api/v1/a/{id})\
    \ returning ownership information ('TTPU mulki'), inventory number, and custodian\
    \ contact phone."
- name: 16. Finance & Straight-Line Depreciation
  description: "Straight-line depreciation forecast calculations ((initialValue -\
    \ salvageValue) / usefulLifeYears) with multi-year schedules and NUMERIC(18,2)\
    \ rounding reconciliation."
- name: "09. Internal Logistics: Issue, Transfer & FT-12.9 Handover Act PDF"
  description: "Warehouse issue (OMBORDA -> YOLDA -> FOYDALANISHDA), room-to-room\
    \ / person-to-person transfer flows with recipient 2FA TOTP confirmation, insert-only\
    \ movement ledger, and official FT-12.9 Handover Act (Dalolatnoma) PDF generation\
    \ with E-IMZO signatures."
