# Russian Error Messages
error.resource_not_found=Запрашиваемый ресурс не найден.
error.validation_failed=Ошибка валидации входных данных запроса.
error.bad_request=Некорректный запрос.
error.state_conflict=Конфликт состояния ресурса.
error.illegal_item_state_transition=Недопустимый переход состояния инвентарного объекта.
error.duplicate_serial_number=Оборудование с таким серийным номером уже существует в данной категории.
error.auth_failed=Ошибка аутентификации: неверный логин, пароль или код 2FA.
error.account_locked=Учетная запись пользователя временно заблокирована или отключена.
error.access_denied=Доступ запрещен: недостаточно прав для выполнения операции.
error.rate_limit_exceeded=Превышен лимит запросов. Пожалуйста, повторите попытку позже.
error.clearance_checklist_blocked=Обходной лист не может быть закрыт: не сдано закрепленное имущество.
error.data_wipe_required=Списание заблокировано: обязательная очистка данных (data-wipe) не выполнена.
error.device_revoked=Устройство было отозвано администратором. Доступ заблокирован.
error.permit_invalid=Пропуск на вынос имущества отсутствует или просрочен.
error.repair_50_percent_replacement=Стоимость ремонта превышает 50% остаточной стоимости. Рекомендуется замена.
error.internal_server_error=Произошла непредвиденная системная ошибка. Пожалуйста, обратитесь к администратору.
