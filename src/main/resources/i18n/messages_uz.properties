# Uzbek Latin Error Messages
error.resource_not_found=So'ralgan ma'lumot topilmadi.
error.validation_failed=So'rov ma'lumotlari tekshiruvdan o'tmadi.
error.bad_request=So'rov noto'g'ri shakllantirilgan.
error.state_conflict=Amalni joriy holatda bajarib bo'lmaydi (ziddiyat).
error.illegal_item_state_transition=Inventar obyekti holatini bunday o'zgartirish taqiqlangan.
error.duplicate_serial_number=Ushbu kategoriyada bunday seriya raqamli jihoz allaqachon mavjud.
error.auth_failed=Autentifikatsiya xatosi: login, parol yoki 2FA kodi noto'g'ri.
error.account_locked=Foydalanuvchi hisobi vaqtincha bloklangan yoki faolsizlantirilgan.
error.access_denied=Ushbu amalni bajarish uchun sizda yetarli ruxsat yo'q.
error.rate_limit_exceeded=So'rovlar soni belgilangan me'yordan oshib ketdi. Birozdan so'ng qayta urinib ko'ring.
error.clearance_checklist_blocked=Aylanma varaqa yopilmadi: xodimga biriktirilgan inventar to'liq topshirilmagan.
error.data_wipe_required=Hisobdan chiqarish rad etildi: IT uskuna xotirasini tozalash (data-wipe) bajarilmagan.
error.device_revoked=Ushbu mobil qurilma administrator tomonidan bekor qilingan.
error.permit_invalid=Universitet hududidan olib chiqish ruxsatnomasi mavjud emas yoki muddati tugagan.
error.room_locked_for_inventory=Xona inventarizatsiya jarayonida bo'lgani sababli aktivlar ko'chirilishi taqiqlangan.
error.repair_50_percent_replacement=Ta'mirlash qiymati qoldiq qiymatning 50% dan oshdi. Yangisiga almashtirish tavsiya etiladi.
error.internal_server_error=Kutilmagan tizim xatoligi yuz berdi. Iltimos, administratorga murojaat qiling.
