# Default & English Error Messages
error.resource_not_found=The requested resource was not found.
error.validation_failed=Request validation failed.
error.bad_request=The request is invalid or malformed.
error.state_conflict=The operation conflicts with the current state of the resource.
error.illegal_item_state_transition=The requested item lifecycle state transition is not permitted.
error.duplicate_serial_number=An item with this serial number already exists in the specified category.
error.auth_failed=Authentication failed: invalid credentials or 2FA verification code.
error.account_locked=The user account is locked or disabled.
error.access_denied=Access denied: insufficient permissions for this operation.
error.rate_limit_exceeded=Too many requests. Please wait before retrying.
error.clearance_checklist_blocked=Clearance checklist cannot be closed until all assigned inventory is handed over.
error.data_wipe_required=Mandatory data-wipe record is required before completing write-off.
error.device_revoked=This mobile device has been revoked by an administrator.
error.permit_invalid=Off-campus permit is missing, invalid, or expired.
error.repair_50_percent_replacement=Repair cost reaches or exceeds 50% of the asset residual value. Replacement recommended.
error.internal_server_error=An unexpected internal error occurred. Please contact the administrator.
