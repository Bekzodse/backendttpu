
spring:
  application:
    name: raqamli-inventar
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ttpu_inventory}
    username: ${DB_USERNAME:ttpu}
    password: ${DB_PASSWORD:ttpu_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8080}

file:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin_secret}
    bucket-name: ${MINIO_BUCKET_NAME:ttpu-inventory}
    region: ${MINIO_REGION:us-east-1}
    max-photo-size-bytes: 10485760
    max-document-size-bytes: 26214400
    auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:true}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name:raqamli-inventar}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true


